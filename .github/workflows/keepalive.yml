name: Keepalive

# GitHub disables scheduled workflows after 60 days of repo inactivity.
# This makes one empty commit per month to keep the repo "active".
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit (keep schedules alive)
        run: |
          git config user.name "syllabai-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "chore: monthly keepalive (schedule anti-disable)"
          git push
